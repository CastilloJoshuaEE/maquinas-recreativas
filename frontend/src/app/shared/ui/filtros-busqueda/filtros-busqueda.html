<div class="filtros-container" [class.collapsed]="collapsed">
  <div class="filtros-header" (click)="toggleCollapse()"><h3><mat-icon>filter_list</mat-icon> Filtros de búsqueda</h3><button mat-icon-button type="button"><mat-icon>{{ collapsed ? 'expand_more' : 'expand_less' }}</mat-icon></button></div>
  <div class="filtros-body" *ngIf="!collapsed">
    <form [formGroup]="filtrosForm" class="filtros-form">
      <div *ngFor="let filter of filters" class="filter-field" [ngClass]="filter.type">
        <mat-form-field appearance="outline" *ngIf="filter.type === 'text'"><mat-label>{{ filter.label }}</mat-label><input matInput [formControlName]="filter.key" [placeholder]="filter.placeholder || ''"><mat-icon matSuffix *ngIf="getFilterValue(filter.key)" (click)="clearFilter(filter.key)">close</mat-icon></mat-form-field>
        <mat-form-field appearance="outline" *ngIf="filter.type === 'select'"><mat-label>{{ filter.label }}</mat-label><mat-select [formControlName]="filter.key"><mat-option value="">Todos</mat-option><mat-option *ngFor="let option of filter.options" [value]="option.value">{{ option.label }}</mat-option></mat-select><mat-icon matSuffix *ngIf="getFilterValue(filter.key)" (click)="clearFilter(filter.key)">close</mat-icon></mat-form-field>
        <mat-form-field appearance="outline" *ngIf="filter.type === 'date'"><mat-label>{{ filter.label }}</mat-label><input matInput [matDatepicker]="picker" [formControlName]="filter.key"><mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle><mat-datepicker #picker></mat-datepicker><mat-icon matSuffix *ngIf="getFilterValue(filter.key)" (click)="clearFilter(filter.key)">close</mat-icon></mat-form-field>
        <div class="date-range" *ngIf="filter.type === 'date-range'"><mat-form-field appearance="outline"><mat-label>Desde</mat-label><input matInput [matDatepicker]="startPicker" [formControlName]="filter.key + '_inicio'"><mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle><mat-datepicker #startPicker></mat-datepicker></mat-form-field><mat-form-field appearance="outline"><mat-label>Hasta</mat-label><input matInput [matDatepicker]="endPicker" [formControlName]="filter.key + '_fin'"><mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle><mat-datepicker #endPicker></mat-datepicker></mat-form-field></div>
        <mat-form-field appearance="outline" *ngIf="filter.type === 'number'"><mat-label>{{ filter.label }}</mat-label><input matInput type="number" [formControlName]="filter.key" [placeholder]="filter.placeholder || ''"><mat-icon matSuffix *ngIf="getFilterValue(filter.key)" (click)="clearFilter(filter.key)">close</mat-icon></mat-form-field>
      </div>
      <div class="filter-actions"><button mat-raised-button color="primary" type="button" (click)="applyFilters()" [disabled]="!hasChanges"><mat-icon>search</mat-icon> Buscar</button><button mat-raised-button type="button" (click)="resetFilters()"><mat-icon>clear</mat-icon> Limpiar</button></div>
    </form>
    <div class="active-filters" *ngIf="activeFilters.length > 0"><span class="active-label">Filtros activos:</span><mat-chip-listbox><mat-chip-option *ngFor="let filter of activeFilters" (removed)="removeFilter(filter.key)">{{ filter.label }}: {{ filter.displayValue }}<mat-icon matChipRemove>cancel</mat-icon></mat-chip-option></mat-chip-listbox></div>
  </div>
</div>

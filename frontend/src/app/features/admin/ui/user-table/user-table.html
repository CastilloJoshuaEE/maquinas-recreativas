<div class="user-table-container">
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Cargando usuarios...</p>
  </div>

  <div *ngIf="!loading && users.length === 0" class="no-results">
    <mat-icon>people_outline</mat-icon>
    <p>No hay usuarios registrados</p>
  </div>

  <div *ngIf="!loading && users.length > 0" class="table-responsive">
    <table mat-table [dataSource]="dataSource" matSort class="user-table">
      
      <!-- Cédula Column -->
      <ng-container matColumnDef="ci">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Cédula </th>
        <td mat-cell *matCellDef="let user"> {{user.ci}} </td>
      </ng-container>

      <!-- Nombre Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let user"> {{user.nombre}} {{user.apellido}} </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
      </ng-container>

      <!-- Usuario Asignado Column -->
      <ng-container matColumnDef="usuario_asignado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Usuario </th>
        <td mat-cell *matCellDef="let user"> {{user.usuario_asignado}} </td>
      </ng-container>

      <!-- Estado Column -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
        <td mat-cell *matCellDef="let user">
          <span class="estado-badge" [ngClass]="getEstadoClass(user.estado)">
            {{user.estado}}
          </span>
        </td>
      </ng-container>

      <!-- Tipo Column -->
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
        <td mat-cell *matCellDef="let user">
          <span class="tipo-badge" [ngClass]="getTipoClass(user.tipo)">
            {{user.tipo}}
          </span>
        </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones" *ngIf="showActions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let user">
          <div class="acciones-container">
            <button mat-icon-button color="primary" (click)="viewHistorial(user)" matTooltip="Ver Historial" *ngIf="showHistorial">
              <mat-icon>history</mat-icon>
            </button>
            <button mat-icon-button color="accent" (click)="editUser(user)" matTooltip="Editar Usuario" *ngIf="showEdit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="changeEstado(user)" matTooltip="Cambiar Estado" *ngIf="showEstado">
              <mat-icon>swap_horiz</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteUser(user)" matTooltip="Eliminar" *ngIf="showDelete">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChangeEvent($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>

<div class="no-autorizado-container">
  <mat-card class="error-card">
    <mat-card-content>
      <div class="error-icon"><mat-icon>lock</mat-icon></div>
      <h1>403 - No Autorizado</h1>
      <p>No tienes permisos para acceder a esta página.</p>
      <p class="mensaje-ayuda">Si crees que esto es un error, por favor contacta al administrador del sistema.</p>
      <div class="botones-accion">
        <a mat-raised-button color="primary" routerLink="/auth/login"><mat-icon>home</mat-icon> Volver al inicio</a>
        <button mat-stroked-button (click)="goBack()"><mat-icon>arrow_back</mat-icon> Página anterior</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>

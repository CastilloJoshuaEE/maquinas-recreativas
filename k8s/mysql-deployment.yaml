apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: recrea-sys
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root123"
            - name: MYSQL_DATABASE
              value: "bd_recrea_sys"
            - name: MYSQL_USER
              value: "recrea_user"
            - name: MYSQL_PASSWORD
              value: "recrea_pass123"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}